# Pages CMS configuration — https://pagescms.org/docs/
#
# Each `content` entry becomes its own tab in the CMS sidebar, and each owns
# its own JSON file. Editing here commits to `master`, which triggers
# .github/workflows/deploy.yml to rebuild and publish the site.

media:
  input: public/uploads
  output: /uploads
  categories: [image]
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: home
    label: Homepage
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: promo
        label: Promotion Section
        type: object
        description: The purple banner section partway down the homepage.
        fields:
          - name: enabled
            label: Show this section
            type: boolean
            default: true
            description: Turn off to hide the entire promotion section from the homepage.

          - name: chipText
            label: Badge text
            type: string
            default: Now Open
            description: Small gold pill above the headline. Leave blank to hide the pill.

          - name: heading
            label: Headline
            type: string
            description: Large white heading, e.g. "Season 4 Late Evaluations".

          - name: image
            label: Flyer image
            type: image
            description: Upload the promotion flyer. Leave blank to show no image.

  - name: schedule
    label: Schedule
    type: file
    path: src/content/schedule.json
    format: json
    fields:
      - name: url
        label: Schedule link
        type: string
        description: >-
          Where the "View Schedule" button on the Schedule page goes.
          Paste the full link, e.g. https://canva.link/coral-gems-june-schedule
